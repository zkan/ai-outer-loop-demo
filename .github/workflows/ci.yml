name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        working-directory: backend
        run: cargo build --locked

      - name: Test
        working-directory: backend
        run: cargo test --locked

  # Frontend job: add beside `backend` when the Vue shell is covered by CI.
